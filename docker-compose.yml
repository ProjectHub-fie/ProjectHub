# A complete ProjectHub deployment on one Docker host.
#
# Why this exists: `tests/` is listed in `.vercelignore`, so the serverless build
# does not contain the suite and the admin test-runner console cannot run it
# there. A Docker deployment ships the whole repository — source, `api/`, `bot/`
# and `tests/` — so the console works out of the box, and the bot gets the
# long-lived process its gateway connection needs.
#
#   docker compose up -d --build        # database, app, bot
#   docker compose run --rm tests       # the suite, on demand
#
# Copy `.env.docker.example` to `.env` first and fill it in; compose reads it
# automatically and nothing secret is baked into this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projecthub}
      POSTGRES_DB: ${POSTGRES_DB:-projecthub}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed so `npm run db:bootstrap` and `scripts/seed-admin.mjs` can be run
      # from the host against the same database.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-projecthub} -d ${POSTGRES_DB:-projecthub}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ${PROJECTHUB_IMAGE:-projecthub:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `sslmode=disable` is what turns the TLS handshake off for the local
      # database. A managed database (Neon) needs `sslmode=require` and no
      # `sslmode=disable`; the connection code follows the URL either way.
      DATABASE_URL: ${DATABASE_URL:-postgres://projecthub:projecthub@db:5432/projecthub?sslmode=disable}
      MAIL_DATABASE_URL: ${MAIL_DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5000}
      PORT: '5000'
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '${APP_PORT:-5000}:5000'
    command: ['npx', 'tsx', 'server/index.ts']

  bot:
    image: ${PROJECTHUB_IMAGE:-projecthub:local}
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://projecthub:projecthub@db:5432/projecthub?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      # Environment-only, never stored in the database.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN must be set in .env}
      NEON_API_KEY: ${NEON_API_KEY:-}
      NEON_PROJECT_IDS: ${NEON_PROJECT_IDS:-}
      NEON_ORG_ID: ${NEON_ORG_ID:-}
      BOT_POLL_INTERVAL_MINUTES: ${BOT_POLL_INTERVAL_MINUTES:-15}
    restart: unless-stopped
    command: ['node', 'bot/index.js']

  # On-demand suite. Not started by `up` (it has no long-running process); run it
  # with `docker compose run --rm tests`. The suite is also reachable from the
  # admin portal, because the image above carries `tests/`.
  tests:
    image: ${PROJECTHUB_IMAGE:-projecthub:local}
    profiles: ['tests']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://projecthub:projecthub@db:5432/projecthub?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      ADMIN_PIN: ${ADMIN_PIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NO_COLOR: '1'
    command: ['node', '--test', '--test-force-exit', 'tests/*.test.mjs']

volumes:
  db-data:
