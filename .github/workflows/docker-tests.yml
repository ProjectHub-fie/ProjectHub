# Docker test runner for the /pbad/tests dashboard.
#
# The ProjectHub website and API live on Vercel; the serverless function cannot
# run a Docker daemon, so it does not try. Instead the admin test-runner console
# dispatches this workflow through the GitHub Actions REST API and this job runs
# the repository's existing `tests` compose service (the same Dockerfile and
# compose file a long-lived host would use).
#
#   /pbad/tests  --dispatch-->  POST /actions/workflows/docker-tests.yml/dispatches
#       ^                         |
#       |--poll run status--------+--------> docker compose run --rm tests
#       |                          |
#       +--read artifacts------->  (uploaded even on failure)
#
# The `request_id` input is generated server-side by api/_lib/suite-runner.js and
# is how the dashboard identifies *its* run among recent ones. It is just a
# correlation id, never a shell command or a path: the test target is the fixed
# `tests` compose service and nothing from the request is interpolated anywhere.
name: Docker Tests

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id generated by the /pbad/tests dashboard.
        required: false
        default: manual
        type: string

run-name: Docker tests (${{ inputs.request_id || 'manual' }})

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ inputs.request_id || 'manual' }}
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # The suite writes real rows to a throwaway database and reads a session
    # secret; both are supplied fresh for this run, never from production.
    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET_CI != '' && secrets.SESSION_SECRET_CI || format('ci-secret-{0}', github.run_id) }}
      ADMIN_PIN: ${{ secrets.ADMIN_PIN_CI != '' && secrets.ADMIN_PIN_CI || '' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_CI != '' && secrets.ADMIN_PASSWORD_CI || '' }}
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show what will run
        run: |
          echo "compose project: ${{ github.event.repository.name }}"
          echo "tests service command is defined in docker-compose.yml, not in this workflow"
          echo "docker compose config --services"
          docker compose config --services

      - name: Run the tests compose service and capture TAP output
        # `--profile tests` is needed because the tests service is behind a
        # profile, so `up` (and a bare `run`) would not start it otherwise.
        # The service's own command (node --test ... tests/*.test.mjs) is used
        # unchanged; this step only starts it. stdout is the TAP stream and is
        # teed to a file for the artifact and the summary.
        #
        # `set -o pipefail` makes the pipeline exit with `docker compose run`'s
        # status instead of `tee`'s (always 0), so the job conclusion reflects
        # the test result and not the wrapper. There is deliberately no
        # `continue-on-error`: the dashboard reads the run conclusion, so a
        # failing suite must make the job fail.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tap"
          docker compose --profile tests run --rm --build tests | tee "$RUNNER_TEMP/tap/tap-output.tap"
          echo "TAP bytes: $(wc -c < "$RUNNER_TEMP/tap/tap-output.tap")"
        env:
          # The compose `tests` service passes DATABASE_URL through unchanged,
          # and its default points at the db service that compose starts with it.
          DATABASE_URL: ${{ vars.DATABASE_URL_CI || 'postgres://projecthub:projecthub@db:5432/projecthub?sslmode=disable' }}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The request id makes the artifact name unique per dispatch, so
          # concurrent runs from the dashboard never collide on one name.
          name: docker-tests-tap-${{ inputs.request_id || 'manual' }}
          path: ${{ runner.temp }}/tap/tap-output.tap
          if-no-files-found: ignore

      - name: Write the step summary
        if: always()
        run: |
          TAP="$RUNNER_TEMP/tap/tap-output.tap"
          if [ ! -s "$TAP" ]; then
            echo "### Docker tests :x: completed with no TAP output" >> "$GITHUB_STEP_SUMMARY"
            echo "See the job log and the docker-tests-tap artifact for details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The compose tests service uses the node spec reporter, whose summary
          # lines are `ℹ tests 10`, `ℹ pass 9`, ... (U+2139). Accept that exact
          # byte sequence, and the old TAP style too, so a reporter switch does
          # not silently blank the summary.
          TESTS=$(LC_ALL=C grep -aE '^(#|ℹ) tests ' "$TAP" | awk '{print $NF}' | tail -1)
          PASS=$(LC_ALL=C grep -aE '^(#|ℹ) pass ' "$TAP" | awk '{print $NF}' | tail -1)
          FAIL=$(LC_ALL=C grep -aE '^(#|ℹ) fail ' "$TAP" | awk '{print $NF}' | tail -1)
          SKIP=$(LC_ALL=C grep -aE '^(#|ℹ) skipped ' "$TAP" | awk '{print $NF}' | tail -1)
          echo "### Docker tests result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAIL" ] && [ "$FAIL" != "0" ]; then
            echo "> :x: $FAIL failing · $PASS passed · $TESTS total ($SKIP skipped)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TESTS" ]; then
            echo "> :white_check_mark: $PASS passed · $TESTS total ($SKIP skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> :question: suite finished, but its summary could not be parsed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by request id \`${{ inputs.request_id || 'manual' }}\` on \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"